          description: ''
  /api/v1/drivers/:
    get:
      operationId: drivers_list
      description: Driver directory with verification and statistics.
      summary: Haydovchi profillari
      parameters:
      - in: query
        name: is_verified
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user__is_blocked
        schema:
          type: boolean
      - in: query
        name: user__role
        schema:
          type: string
          title: Rol
          enum:
          - both
          - driver
          - passenger
        description: |-
          Platformadagi vazifa: yo'lovchi, haydovchi yoki ikkalasi.

          * `passenger` - Yo'lovchi
          * `driver` - Haydovchi
          * `both` - Yo'lovchi va haydovchi
      tags:
      - drivers
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDriverProfileList'
          description: ''
