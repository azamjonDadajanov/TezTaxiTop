      - body
      - created_at
      - id
      - is_from_support
      - is_mine
      - sender
      - sender_name
      - ticket
    SupportMessageCreateRequest:
      type: object
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        attachment_url:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
      required:
      - body
    SupportTicket:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_name:
          type: string
          readOnly: true
        order:
          type: integer
          nullable: true
          title: Buyurtma
          description: 'Ixtiyoriy: buyurtma bilan bog''liq murojaat bo''lsa.'
        subject:
          type: string
          title: Mavzu
          maxLength: 200
        category:
          allOf:
          - $ref: '#/components/schemas/SupportTicketCategoryEnum'
          title: Kategoriya
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          title: Ustuvorlik
        status:
          allOf:
          - $ref: '#/components/schemas/SupportTicketStatusEnum'
          readOnly: true
          title: Holati
        status_display:
          type: string
          readOnly: true
        is_anonymous:
          type: boolean
          title: Anonim murojaat
          description: Telegram orqali yuborilgan va foydalanuvchining ismi ko'rsatilmasin.
        last_message_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Oxirgi xabar vaqti
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Yaratilgan vaqti
          description: Yozma yaratilgan payt (UTC, vaqt zonasi bilan).
      required:
      - created_at
      - id
      - last_message_at
      - status
      - status_display
      - subject
      - user_name
    SupportTicketCategoryEnum:
      enum:
      - payment
      - subscription
      - ride
      - verification
      - account
      - technical
      - other
      type: string
      description: |-
        * `payment` - To'lov
        * `subscription` - Obuna
        * `ride` - Yo'lov
        * `verification` - Tasdiqlash
        * `account` - Akkaunt
        * `technical` - Texnik
        * `other` - Boshqa
    SupportTicketCreateCategoryEnum:
      enum:
      - payment
      - subscription
      - ride
      - verification
      - account
      - technical
      - other
      type: string
      description: |-
        * `payment` - payment
        * `subscription` - subscription
        * `ride` - ride
        * `verification` - verification
        * `account` - account
        * `technical` - technical
        * `other` - other
    SupportTicketCreateRequest:
      type: object
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        category:
          allOf:
          - $ref: '#/components/schemas/SupportTicketCreateCategoryEnum'
          default: other
        body:
          type: string
          minLength: 1
          maxLength: 4000
        order_id:
          type: integer
          nullable: true
        is_anonymous:
          type: boolean
          default: false
      required:
      - body
      - subject
    SupportTicketStatusEnum:
      enum:
      - open
      - in_progress
      - closed
      type: string
      description: |-
        * `open` - Ochiq
        * `in_progress` - Ko'rib chiqilmoqda
        * `closed` - Yopilgan
