openapi: 3.0.3
info:
  title: TezTaxiTop API
  version: 1.0.0
  description: Telegram based taxi marketplace API. Passengers search for rides, drivers
    publish trips, orders are matched, booked and completed.
paths:
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Token orqali autentifikatsiyalangan foydalanuvchi ma'lumotlarini
        qaytaradi.
      summary: Joriy foydalanuvchi
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Rol va bloklash holati bu endpoint orqali o'zgartirilmaydi.
      summary: O'z profilini tahrirlash
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/me/role/:
    patch:
      operationId: auth_me_role_partial_update
      description: '`passenger`, `driver` yoki `both`. Haydovchi roli `DriverProfile`
        yaratadi.'
      summary: Rolni o'zgartirish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRoleUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRoleUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRoleUpdateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/register-telegram/:
    post:
      operationId: auth_register_telegram_create
      description: Bot yoki Mini App uchun. `telegram_id` bo'yicha mavjud hisob qaytariladi,
        yo'q bo'lsa yangi yaratiladi. Bot tokeni tekshiruvi transport qatlamida amalga
        oshiriladi.
      summary: Telegram orqali ro'yxatdan o'tish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TelegramRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TelegramRegistrationRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Yangi hisob yaratildi.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Mavjud hisob qaytarildi.
        '403':
          description: Hisob bloklangan.
  /api/v1/become-driver/:
    post:
      operationId: become_driver_create
      description: Yo'lovchi hisobini haydovchiga aylantiradi va `DriverProfile` yaratadi.
      summary: Haydovchi roliga o'tish
      tags:
      - become-driver
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
          description: ''
  /api/v1/chat/chats/:
    get:
      operationId: chat_chats_retrieve
      description: Haydovchi yoki yo'lovchi bo'lgan barcha buyurtmalar suhbatlari.
      summary: Suhbatlar ro'yxati
      tags:
      - chat
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
