      - plan_id
    SupportMessage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ticket:
          type: integer
          readOnly: true
          title: Murojaat
        sender:
          type: integer
          readOnly: true
          title: Yuboruvchi
        sender_name:
          type: string
          readOnly: true
        body:
          type: string
          title: Matn
          maxLength: 4000
        is_from_support:
          type: boolean
          readOnly: true
          title: Qo'llab-quvvatlashdan
        attachment_url:
          title: Fayl havolasi
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        is_mine:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Yaratilgan vaqti
