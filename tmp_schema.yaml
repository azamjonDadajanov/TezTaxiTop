          readOnly: true
        counterpart_name:
          type: string
          nullable: true
          readOnly: true
        last_message:
          type: string
          readOnly: true
        unread_count:
          type: integer
          readOnly: true
        is_closed:
          type: boolean
          readOnly: true
        last_message_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Oxirgi xabar vaqti
          description: Ro'yxatni tez tartibga solish va 'yangi xabar' belgisini hisoblash
            uchun.
        created_at:
          type: string
          format: date-time
          readOnly: true
