          description: ''
  /api/v1/chat/chats/{order_id}/messages/:
    get:
      operationId: chat_chats_messages_list
      description: 'Polling uchun: `?after=<message_id>` parametri orqali faqat yangi
        xabarlar qaytariladi. Javob `next_after_id` maydoni bilan keyingi so''rov
        uchun kursor beradi.'
      summary: Xabarlar ro'yxati
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
          description: ''
    post:
      operationId: chat_chats_messages_create
      summary: Xabar yuborish
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatMessageCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatMessageCreateRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
          description: ''
  /api/v1/chat/chats/{order_id}/read/:
    post:
      operationId: chat_chats_read_create
      description: Barcha xabarlarni o'qilgan deb belgilaydi (idempotent).
      summary: Xabarlarni o'qilgan deb belgilash
      parameters:
      - in: path
        name: order_id
        schema:
          type: integer
        required: true
      tags:
      - chat
      security:
