      properties:
        telegram_id:
          type: integer
          minimum: 1
        username:
          type: string
          nullable: true
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone_number:
          type: string
          maxLength: 20
        language_code:
          type: string
          maxLength: 10
      required:
      - telegram_id
    TripLocation:
      type: object
      description: Compact location block embedded in trip responses.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        district:
          type: string
          readOnly: true
        region:
          type: string
          readOnly: true
        latitude:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        longitude:
          type: number
          format: double
          maximum: 1000
          minimum: -1000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
      required:
      - district
      - id
      - latitude
      - longitude
      - name
      - region
    TripMatch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        trip_id:
          type: integer
          readOnly: true
        route:
          type: string
          readOnly: true
        departure_time:
          type: string
          format: date-time
          readOnly: true
        price_per_seat:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        available_seats:
          type: integer
          readOnly: true
        driver_name:
          type: string
          readOnly: true
        driver_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
          readOnly: true
        vehicle_name:
          type: string
          readOnly: true
        plate_number:
          type: string
          readOnly: true
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          title: Ball
          description: 0 dan 100 gacha.
        rank:
          type: integer
          readOnly: true
          title: O'rin
          description: Shu so'rov bo'yicha reytingdagi o'rni (1 - eng yaxshi).
        components:
          type: object
          additionalProperties: {}
          readOnly: true
        reasons:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Yaratilgan vaqti
          description: Yozma yaratilgan payt (UTC, vaqt zonasi bilan).
      required:
      - available_seats
      - components
      - created_at
      - departure_time
      - driver_name
      - driver_rating
      - id
      - plate_number
      - price_per_seat
      - rank
      - reasons
      - route
      - score
      - trip_id
      - vehicle_name
    TypeCd5Enum:
      enum:
      - text
      - system
      - location
      type: string
      description: |-
        * `text` - Matn
        * `system` - Tizim
        * `location` - Manzil
    User:
      type: object
      description: Full read representation of an account.
      properties:
        id:
          type: integer
          readOnly: true
        telegram_id:
          type: integer
          readOnly: true
          nullable: true
          description: Telegram hisobining noyob raqami. Bo'sh bo'lishi mumkin (admin
            panel orqali yaratilgan hisoblar uchun).
        username:
          type: string
          readOnly: true
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        phone_number:
          type: string
          readOnly: true
          title: Telefon raqami
          description: +998901234567 ko'rinishida saqlanadi.
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Rol
          description: |-
            Platformadagi vazifa: yo'lovchi, haydovchi yoki ikkalasi.

            * `passenger` - Yo'lovchi
            * `driver` - Haydovchi
            * `both` - Yo'lovchi va haydovchi
        role_display:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_blocked:
          type: boolean
          readOnly: true
          title: Bloklangan
          description: Administrator tomonidan bloklangan foydalanuvchi.
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can log into this admin site.
        language_code:
          type: string
          readOnly: true
          title: Til kodi
          description: Foydalanuvchi interfeys tili (uz / ru / en).
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Oxirgi faollik
          description: Foydalanuvchi bot bilan oxirgi marta muloqot qilgan payt.
        driver_profile:
          allOf:
          - $ref: '#/components/schemas/DriverProfile'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Yaratilgan vaqti
          description: Yozma yaratilgan payt (UTC, vaqt zonasi bilan).
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Yangilangan vaqti
          description: Yozma oxirgi marta yangilangan payt (UTC, vaqt zonasi bilan).
      required:
      - created_at
      - date_joined
      - driver_profile
      - first_name
      - full_name
      - id
      - is_active
      - is_blocked
      - is_staff
      - language_code
      - last_name
      - last_seen_at
      - phone_number
      - role
      - role_display
      - telegram_id
      - updated_at
      - username
